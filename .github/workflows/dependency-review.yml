name: Dependency review

# Fails a pull request that adds a dependency with a known high-severity vulnerability or a
# license that can't ship in a GPL-3.0-or-later app.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, LGPL-2.0-only, LGPL-2.1-only, SSPL-1.0, BUSL-1.1
