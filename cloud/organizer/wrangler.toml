name = "knoa-organizer"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

[[queues.consumers]]
queue = "knoa-organize"
# Jobs in one batch run side by side; each makes a handful of requests.
max_batch_size = 4
max_retries = 8
dead_letter_queue = "knoa-organize-failed"

# Results for jobs the main queue gave up on (see FAILED_QUEUE).
[[queues.consumers]]
queue = "knoa-organize-failed"
max_batch_size = 10

# The API Worker that stores results. Without it, results are only logged.
# [[services]]
# binding = "API"
# service = "knoa-api"
