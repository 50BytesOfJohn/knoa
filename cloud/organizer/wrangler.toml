# Secrets, set per environment with `wrangler secret put`: OPENROUTER_API_KEY and
# INTERNAL_SECRET (the same value as the API Worker's).
name = "knoa-organizer"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

[env.staging]
name = "knoa-organizer-staging"

[[env.staging.queues.consumers]]
queue = "knoa-organize-staging"
# Jobs in one batch run side by side; each makes a handful of requests.
max_batch_size = 4
max_retries = 8
dead_letter_queue = "knoa-organize-dlq-staging"

# Results for jobs the main queue gave up on (see FAILED_QUEUE_MARK).
[[env.staging.queues.consumers]]
queue = "knoa-organize-dlq-staging"
max_batch_size = 10

# The API Worker that stores results. Without it, results are only logged.
[[env.staging.services]]
binding = "API"
service = "knoa-api-staging"

[env.production]
name = "knoa-organizer"

[[env.production.queues.consumers]]
queue = "knoa-organize"
max_batch_size = 4
max_retries = 8
dead_letter_queue = "knoa-organize-dlq"

[[env.production.queues.consumers]]
queue = "knoa-organize-dlq"
max_batch_size = 10

[[env.production.services]]
binding = "API"
service = "knoa-api"
