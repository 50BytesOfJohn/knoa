[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/knoa"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/50BytesOfJohn/knoa"
publish = false

[workspace.dependencies]
# GPUI is consumed through the `gpui-pre` snapshots of Zed's crates (see docs/adr/0001).
# Pins are exact: every snapshot may break GPUI's API. Bump all of them together, and
# keep them in step with the version gpui-component pins if/when we adopt it.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = [
  "font-kit",
  "runtime_shaders",
] }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight GPUI's builder-style API or add noise without value.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints we opt into.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
# GPUI is heavy; optimizing dependencies keeps debug builds responsive.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
