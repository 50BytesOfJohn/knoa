[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/knoa"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/50BytesOfJohn/knoa"
publish = false

[workspace.dependencies]
# GPUI is consumed through the `gpui-pre` snapshots of Zed's crates (see docs/adr/0001).
# Pins are exact: every snapshot may break GPUI's API. Bump all of them together, and
# keep them in step with the version gpui-component pins if/when we adopt it.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = [
  "font-kit",
  "runtime_shaders",
] }

gpui-component = "=0.9.0"
# Lucide icons as SVG assets, the same set gpui-component uses.
gpui-kit-assets = "=0.9.0"
# Only for the stroke cap and join types that GPUI's path builder takes but doesn't
# re-export. Keep it on the same major version as GPUI's own lyon.
lyon_tessellation = "1"

knoa-ai = { path = "crates/knoa-ai" }
knoa-browser = { path = "crates/knoa-browser" }
knoa-core = { path = "crates/knoa-core" }
knoa-fetch = { path = "crates/knoa-fetch" }
knoa-store = { path = "crates/knoa-store" }

anyhow = "1"
dirs = "6"
futures = "0.3"
imagesize = "0.15"
jiff = "0.2"
notify = "8"
# Objective-C messaging for the AppKit and Sparkle calls GPUI doesn't wrap. Same majors
# as GPUI's own, so no second copy is built.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
] }
objc2-foundation = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "gzip",
  "brotli",
  "charset",
  "http2",
] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "fs",
] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight GPUI's builder-style API or add noise without value.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pixel, duration and count math moves small values between f32, f64 and integers all
# the time; checked conversions there add noise without catching real bugs.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# View render helpers are methods even when they only need `cx`; it keeps call sites uniform.
unused_self = "allow"
similar_names = "allow"
# Restriction lints we opt into.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
# GPUI is heavy; optimizing dependencies keeps debug builds responsive.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
