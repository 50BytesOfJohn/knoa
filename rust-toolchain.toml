# GPUI tracks the latest stable Rust; bump this together with the gpui-pre pins.
[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
# Distribution builds are universal; the API consumes the shared crates as WebAssembly.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "wasm32-unknown-unknown",
]
profile = "minimal"
