# git-cliff turns commit titles into CHANGELOG.md and each release's notes. Titles are
# plain imperative sentences ("Add ...", "Fix ..."), so they're grouped by their first word.
# A commit with "[skip changelog]" in its message is left out.

[changelog]
header = """
# Changelog

What changed in each Knoa release. Downloads are on the
[releases page](https://github.com/50BytesOfJohn/knoa/releases).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/50BytesOfJohn/knoa/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  # "Title (#12)", as GitHub writes squash merges, links the pull request.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/50BytesOfJohn/knoa/pull/${1}))" },
]
commit_parsers = [
  { message = "\\[skip changelog\\]", skip = true },
  { message = "^Release [0-9]", skip = true },
  { message = "^Docs?:", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^Bump ", skip = true },
  { message = "^Add", group = "<!-- 0 -->Added" },
  { message = "^Fix", group = "<!-- 2 -->Fixed" },
  { message = "^(Remove|Drop)", group = "<!-- 3 -->Removed" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]
